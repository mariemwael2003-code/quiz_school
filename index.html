<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 10 Vocabulary Flashcards</title>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--text:#1d2433;--muted:#667085;--primary:#4f46e5;--primary-text:#ffffff;
  --ok:#16a34a;--ok-bg:#dcfce7;--bad:#dc2626;--bad-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;--border:#e2e6ef;--pic:#eef2ff;
  --gold:#f5b301;--silver:#9aa4b2;--bronze:#c2773a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420;--card:#1a2130;--text:#eef1f8;--muted:#9aa4b8;--primary:#818cf8;--primary-text:#0f1420;
    --ok:#4ade80;--ok-bg:#12351f;--bad:#f87171;--bad-bg:#3d1717;--warn:#fbbf24;--warn-bg:#3b2a08;--border:#2b3448;--pic:#232b44;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420;--card:#1a2130;--text:#eef1f8;--muted:#9aa4b8;--primary:#818cf8;--primary-text:#0f1420;
  --ok:#4ade80;--ok-bg:#12351f;--bad:#f87171;--bad-bg:#3d1717;--warn:#fbbf24;--warn-bg:#3b2a08;--border:#2b3448;--pic:#232b44;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.2rem;margin:0 0 8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.04);position:relative}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;padding:13px 14px;font-size:1rem;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit}
input:focus{outline:none;border-color:var(--primary)}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av{font-size:1.7rem;padding:8px 0;border-radius:14px;border:2px solid var(--border);background:var(--bg);cursor:pointer;text-align:center}
.av.sel{border-color:var(--primary);background:var(--pic);transform:scale(1.06)}
.seg{display:flex;gap:10px}
.seg button{flex:1}
button{font-family:inherit;font-size:1rem;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:var(--primary);color:var(--primary-text);font-weight:700;margin-top:14px}
.btn:disabled{opacity:.6}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn.sm{width:auto;padding:9px 14px;font-size:.9rem;margin-top:0}
.choice{padding:13px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-weight:600}
.choice.sel{border-color:var(--primary);background:var(--pic);color:var(--text)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);gap:8px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--pic);color:var(--primary)}
.pic{width:100%;max-width:420px;aspect-ratio:200/140;margin:12px auto;border-radius:16px;overflow:hidden;background:var(--pic)}
.pic svg{display:block;width:100%;height:100%}
.pic.mini{max-width:210px;margin:8px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-weight:600}
.opt.def{font-weight:500;font-size:.98rem}
.opt.pick{border-color:var(--primary);background:var(--pic)}
.opt:disabled{cursor:default;opacity:1}
.word{font-size:2rem;font-weight:800;text-align:center;margin:14px 0 10px;color:var(--primary)}
.tline{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.tbar{flex:1;height:12px;background:var(--border);border-radius:99px;overflow:hidden}
.tbar>i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px}
.tbar>i.mid{background:var(--warn)}.tbar>i.low{background:var(--bad)}
.tnum{font-weight:800;font-size:1.3rem;min-width:1.6em;text-align:right}
.up{position:absolute;inset:0;border-radius:18px;background:rgba(220,38,38,.93);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:1.8rem;font-weight:800;z-index:5}
.up small{font-size:.95rem;font-weight:600;margin-top:6px}
.score{font-size:3.2rem;font-weight:800;text-align:center;margin:4px 0}
.center{text-align:center}
.row{display:flex;gap:9px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:16px 0}
.pod{border-radius:16px;padding:12px 6px;text-align:center;background:var(--card);border:2px solid var(--border)}
.pod .m{font-size:1.8rem}.pod .a{font-size:2rem}.pod .n{font-weight:700;word-break:break-word}.pod .s{font-weight:800;font-size:1.1rem}
.pod.p1{border-color:var(--gold);padding-bottom:26px}.pod.p2{border-color:var(--silver)}.pod.p3{border-color:var(--bronze)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 4px}
.lb .r{width:26px;font-weight:800;color:var(--muted)}.lb .a{font-size:1.5rem}.lb .n{flex:1;font-weight:600}
.lb .s{font-weight:800}
details{border-bottom:1px solid var(--border)}details:last-child{border:none}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.det{padding:0 4px 12px;font-size:.9rem}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-weight:700}
.tabs button.on{border-color:var(--primary);background:var(--pic);color:var(--primary)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:8px;font-size:.85rem}
.note{background:var(--pic);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:10px}
.note.warn{background:var(--warn-bg)}.note.ok{background:var(--ok-bg)}.note.bad{background:var(--bad-bg)}
.rules{padding-left:20px;margin:8px 0}.rules li{margin:8px 0}
.rv{border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
.rv .yours{color:var(--bad);font-weight:600;margin-top:6px}.rv .right{color:var(--ok);font-weight:600;margin-top:6px}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-left:6px}
.chip.ok{background:var(--ok-bg)}.chip.bad{background:var(--bad-bg)}.chip.warn{background:var(--warn-bg)}
.prog{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px}.prog>i{display:block;height:100%;background:var(--primary)}
.sec{font-weight:800;margin:18px 0 6px}
</style>
</head>
<body>
<div id="app"></div>
<script>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=n=>String(n).replace(/^[=+\-@\s]+/,"").trim().toLowerCase().replace(/\s+/g," ");
const mem={};
function store(k,v){
  try{
    if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}
    if(v===null){localStorage.removeItem(k);return}
    localStorage.setItem(k,JSON.stringify(v));
  }catch(e){ if(v===undefined)return mem[k]===undefined?null:mem[k]; mem[k]=v; }
}
function seedOf(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtTime(s){const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")}catch(_){}ta.remove();
  }
  if(btn){const o=btn.textContent;btn.textContent="Copied ✓";setTimeout(()=>btn.textContent=o,1500)}
}

/* ---------------- BACKEND (Google Apps Script) or PREVIEW (this device only) ---------------- */
const HAS_GAS=typeof google!=="undefined"&&google.script&&google.script.run;
function gas(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)})}
const LK="fc3_rows";
const lrows=()=>store(LK)||{};
const localApi={
  async join(name,cls,avatar){
    const rows=lrows();name=String(name).replace(/^[=+\-@\s]+/,"").replace(/\s+/g," ").trim().slice(0,30);
    const key=cls+"|"+norm(name);
    if(rows[key])return{created:false,row:rows[key]};
    const slots=Object.values(rows).filter(r=>r.cls===cls).map(r=>r.slot);
    const slot=slots.length?Math.max(...slots)+1:0;
    const now=Date.now();
    const row={key,name,cls,avatar,slot,status:"playing",score:0,pic:0,answered:0,time:0,leaves:0,reason:"",startedAt:now,updatedAt:now,hiddenAt:0,closed:0,qStart:0,ans:[]};
    rows[key]=row;store(LK,rows);return{created:true,row};
  },
  async update(key,p){
    const rows=lrows();const r=rows[key];if(!r)return null;
    if(r.status!=="playing")return r;
    ["status","score","pic","answered","time","leaves","reason","hiddenAt","closed","qStart","ans"].forEach(f=>{if(p[f]!==undefined)r[f]=p[f]});
    r.updatedAt=Date.now();store(LK,rows);return r;
  },
  async admin(pass){if(pass!==LOCAL_PASS)return{error:"wrong"};return{rows:Object.values(lrows()),now:Date.now()}},
  async reset(pass,key){if(pass!==LOCAL_PASS)return false;const rows=lrows();delete rows[key];store(LK,rows);return true}
};
const api=HAS_GAS?{
  join:(n,c,a)=>gas("apiJoin",n,c,a),
  update:(k,p)=>gas("apiUpdate",k,p),
  admin:p=>gas("apiAdmin",p),
  reset:(p,k)=>gas("apiReset",p,k)
}:localApi;

/* ---------------- QUESTIONS (unique order per student) ----------------
   Each student gets a "slot" (0,1,2…) inside their class. Slot decides which word they start with,
   so two students of the same class are never on the same word at the same time (up to 19 students per class).
   Every word: picture question first, then its definition question. */
function wordOrder(cls,slot){
  const block=Math.floor(slot/N),off=slot%N;
  let step=(block+1)*(cls==="10A"?1:-1);step=((step%N)+N)%N;
  const out=[];for(let i=0;i<N;i++)out.push(BASE[(off+step*i)%N]);return out;
}
function buildQs(cls,slot,key){
  const rng=mulberry32(seedOf(key+"#"+slot));
  const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const qs=[];
  wordOrder(cls,slot).forEach(w=>["pic","def"].forEach(type=>{
    const others=sh([...Array(N).keys()].filter(x=>x!==w)).slice(0,2);
    qs.push({type,w,opts:sh([w,...others])});
  }));
  return qs;
}
function calc(ans,qs){let score=0,pic=0;ans.forEach((k,i)=>{const q=qs[i];if(q&&k>=0&&q.opts[k]===q.w){score++;if(q.type==="pic")pic++}});return{score,pic}}

/* ---------------- ATTEMPT STATE ---------------- */
let A=null,quizOn=false,draft={};
function mk(row){
  return{key:row.key,name:row.name,cls:row.cls,avatar:row.avatar,slot:row.slot,qs:buildQs(row.cls,row.slot,row.key),
    ans:(row.ans||[]).slice(),qStart:row.qStart||0,startedAt:row.startedAt||Date.now(),leaves:row.leaves||0,hiddenAt:row.hiddenAt||0,
    closed:row.closed?1:0,tt:(row.time||0)*1000,status:row.status,reason:row.reason||"",sent:row.sent||0,warn:0,busy:false};
}
function snap(a){
  const c=calc(a.ans,a.qs);
  return{key:a.key,name:a.name,cls:a.cls,avatar:a.avatar,slot:a.slot,status:a.status,reason:a.reason,ans:a.ans,answered:a.ans.length,
    score:c.score,pic:c.pic,time:Math.round(a.tt/1000),leaves:a.leaves,hiddenAt:a.hiddenAt,closed:a.closed?1:0,qStart:a.qStart,startedAt:a.startedAt,sent:a.sent||0};
}
const persist=()=>{if(A)store("fc3_me",snap(A))};
let pumping=false,dirty=false;
function sync(){dirty=true;pump()}
async function pump(){
  if(pumping)return;pumping=true;
  while(dirty&&A&&A.status==="playing"){
    dirty=false;
    try{await api.update(A.key,snap(A))}catch(e){dirty=true;await sleep(3000)}
  }
  pumping=false;
}
async function pushFinal(){ // finished or out: retry until the server has it (Wi-Fi problems)
  const a=A;
  for(let t=0;t<200&&!a.sent;t++){
    try{await api.update(a.key,snap(a));a.sent=1;persist();break}catch(e){await sleep(3000)}
  }
  const el=$("#sent");if(el&&A===a)showSent(el);
}

function viewRules(err){

function decide(row){ // for a row that is still "playing" when someone comes back to it
  const away=Date.now()-(row.hiddenAt||0);
  return (!row.closed&&row.hiddenAt&&away<=GRACE_MS&&(row.leaves||0)<=MAX_LEAVES)?"resume":"out";
}
function handleRow(row,created){
  if(created){A=mk(row);return beginQuiz()}
  if(row.status==="finished"){A=mk(row);A.sent=1;return viewResult(A,true)}
  if(row.status==="out"){A=mk(row);A.sent=1;return viewOut(A)}
  if(decide(row)==="resume"){A=mk(row);return resumeQuiz()}
  A=mk(row);goOut("Closed the quiz or left the page and came back");
}
function beginQuiz(){
  quizOn=true;A.status="playing";A.qStart=Date.now();persist();sync();keepAwake();renderQ();
}
async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
function resumeQuiz(){
  quizOn=true;A.hiddenAt=0;A.warn=1;catchUp();persist();sync();keepAwake();
  if(A.ans.length>=TOTAL)return finish();
  renderQ();
}
function catchUp(){ // questions whose time ran out while the screen was locked count as unanswered
  const el=Date.now()-A.qStart;
  if(!A.qStart||el<QTIME)return;
  const n=Math.max(1,Math.floor((el+TUP)/(QTIME+TUP)));
  for(let i=0;i<n&&A.ans.length<TOTAL;i++){A.ans.push(-1);A.tt+=QTIME}
  A.qStart=Date.now();
}
function renderQ(){
  const i=A.ans.length,q=A.qs[i],isPic=q.type==="pic";
  app.innerHTML=`
  <div class="topbar"><span>${A.avatar} ${esc(A.name)} · ${A.cls}</span><span>${i+1} / ${TOTAL}</span></div>
  <div class="bar"><i style="width:${Math.round(i/TOTAL*100)}%"></i></div>
  ${A.warn?`<div class="note warn">⚠️ You left the page. That was your one chance — leaving again puts you out.</div>`:""}
  <div class="card">
    <div class="up" id="up">⏰ Time's up!<small>Moving on…</small></div>
    <span class="tag">${isPic?"Picture · Which word is this?":"Meaning · Choose the definition"}</span>
    <div class="tline"><div class="tbar"><i id="tb"></i></div><div class="tnum" id="tn">${QTIME/1000}</div></div>
    ${isPic?`<div class="pic">${ART[WORDS[q.w].w]()}</div>`:`<div class="word">${esc(WORDS[q.w].w)}</div>`}
    <div class="opts">
      ${q.opts.map((o,k)=>`<button class="opt${isPic?"":" def"}" data-k="${k}">${esc(isPic?WORDS[o].w:WORDS[o].d)}</button>`).join("")}
    </div>
  </div>`;
  A.busy=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  tick();
}
function tick(){
  if(!quizOn||!A||A.status!=="playing"||A.busy||document.hidden)return;
  const rem=QTIME-(Date.now()-A.qStart);
  const bar=$("#tb"),tn=$("#tn");
  if(bar){bar.style.width=Math.max(0,rem/QTIME*100)+"%";bar.className=rem<=3000?"low":rem<=5500?"mid":""}
  if(tn)tn.textContent=Math.max(0,Math.ceil(rem/1000));
  if(rem<=0)timeUp();
}
setInterval(tick,100);
function answer(k){
  if(A.busy||A.status!=="playing")return;
  A.busy=true;A.tt+=Math.min(QTIME,Date.now()-A.qStart);A.ans.push(k);persist();
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===k)b.classList.add("pick")});
  setTimeout(nextQ,350);
}
function timeUp(){
  A.busy=true;A.tt+=QTIME;A.ans.push(-1);persist();
  const up=$("#up");if(up)up.style.display="flex";
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  setTimeout(nextQ,TUP);
}
function nextQ(){
  if(!A||A.status!=="playing")return;
  if(A.ans.length>=TOTAL)return finish();
  A.qStart=Date.now();persist();sync();renderQ();
}
function finish(){
  quizOn=false;A.status="finished";A.busy=false;persist();
  viewResult(A);pushFinal();
}
function goOut(reason){
  quizOn=false;A.status="out";A.reason=reason;A.busy=false;persist();
  viewOut(A);pushFinal();
}

/* leaving the page while the quiz is running */
document.addEventListener("visibilitychange",()=>{
  if(!quizOn||!A)return;
  if(document.hidden){
    if(A.status!=="playing")return;
    A.hiddenAt=Date.now();A.leaves++;persist();
    if(A.leaves>MAX_LEAVES){A.status="out";A.reason="Switched tab/app (left the quiz page)";persist();api.update(A.key,snap(A)).then(()=>{A.sent=1;persist()}).catch(()=>{})}
    else sync();
  }else{
    if(A.status==="out")return goOut(A.reason||"Left the quiz page");
    if(A.status!=="playing")return;
    const away=Date.now()-A.hiddenAt;
    if(away<1500){A.leaves=Math.max(0,A.leaves-1);A.hiddenAt=0;persist();sync();return}
    if(away>GRACE_MS)return goOut("Left the quiz page for too long");
    A.hiddenAt=0;A.warn=1;catchUp();persist();sync();
    if(A.ans.length>=TOTAL)return finish();
    if(!A.busy)renderQ();
  }
});
window.addEventListener("pagehide",()=>{
  if(quizOn&&A&&A.status==="playing"){A.closed=1;persist();try{api.update(A.key,snap(A))}catch(e){}}
});

function viewOut(a){
  app.innerHTML=`
  <h1 class="center">🚫 You're out of the quiz</h1>
  <div class="card center">
    <p>${a.avatar} <b>${esc(a.name)}</b> · ${a.cls}</p>
    <p>Leaving the quiz page (closing it, refreshing, or switching tab/app) ends the attempt.</p>
    <p class="muted">Your teacher has been notified. Each student has one attempt.</p>
    <div id="sent" class="note"></div>
  </div>
  <div class="center"><button class="link" id="nxt">Not you? Next student</button></div>`;
  showSent($("#sent"));
  $("#nxt").onclick=()=>{store("fc3_me",null);A=null;draft={};viewStart()};
}
function showSent(el){
  const a=A;if(!el||!a)return;
  if(!HAS_GAS){el.className="note warn";el.textContent="Preview mode: saved on this device only.";return}
  if(a.sent){el.className="note ok";el.textContent="✅ Your teacher has received your result.";}
  else{el.className="note";el.textContent="Sending your result to your teacher… keep this page open."}
}
function reviewHTML(a){
  const items=[];
  a.ans.forEach((k,i)=>{
    const q=a.qs[i];if(!q)return;
    if(k>=0&&q.opts[k]===q.w)return;
    const W=WORDS[q.w];
    const yours=k<0?`<span class="chip warn">⏰ No answer</span>`:`Your answer: ${esc(q.type==="pic"?WORDS[q.opts[k]].w:WORDS[q.opts[k]].d)}`;
    if(q.type==="pic"){
      items.push(`<div class="rv"><span class="tag">Picture</span><div class="pic mini">${ART[W.w]()}</div><div class="yours">${yours}</div><div class="right">✔ Correct: ${esc(W.w)}</div><div class="muted">${esc(W.w)} — ${esc(W.d)}</div></div>`);
    }else{
      items.push(`<div class="rv"><span class="tag">Meaning</span><div style="font-size:1.3rem;font-weight:800;margin-top:6px">${esc(W.w)}</div><div class="yours">${yours}</div><div class="right">✔ Correct: ${esc(W.d)}</div></div>`);
    }
  });
  return items;
}
function viewResult(a,already){
  const c=calc(a.ans,a.qs),time=Math.round(a.tt/1000)||0;
  const pct=Math.round(c.score/TOTAL*100);
  const noans=a.ans.filter(k=>k<0).length;
  const msg=pct>=90?"Outstanding! 🌟":pct>=75?"Great job! 👏":pct>=50?"Good effort — keep practising! 💪":"Keep going — review the questions below! 📖";
  const rv=reviewHTML(a);
  app.innerHTML=`
  <h1 class="center">${a.avatar} ${esc(a.name)}</h1>
  <p class="center muted">Class ${a.cls} · Time ${fmtTime(time)}</p>
  ${already?`<div class="note center">You have already taken this quiz — here is your result. Each student has one attempt.</div>`:""}
  <div class="card center">
    <div class="score">${c.score} / ${TOTAL}</div>
    <p><b>${msg}</b> (${pct}%)</p>
    <p class="muted">Pictures: ${c.pic} / ${N} · Meanings: ${c.score-c.pic} / ${N}${noans?` · Unanswered: ${noans}`:""}</p>
    <div id="sent" class="note"></div>
  </div>
  ${rv.length?`<h2>📖 Questions to review (${rv.length})</h2>${rv.join("")}`:`<div class="card center"><h2>Perfect! 🏆</h2><p class="muted">You answered every question correctly.</p></div>`}
  <div class="center"><button class="link" id="nxt">Not you? Next student</button></div>`;
  showSent($("#sent"));
  $("#nxt").onclick=()=>{store("fc3_me",null);A=null;draft={};viewStart()};
}

/* ---------------- TEACHER AREA ---------------- */
let adm={pass:"",tab:"All",rows:[],now:0,open:{},timer:null};
function stopAdmin(){if(adm.timer){clearInterval(adm.timer);adm.timer=null}}
function viewAdminGate(err){
  stopAdmin();
  app.innerHTML=`
  <h1>🔒 Teacher area</h1>
  <div class="card">
    <p class="muted">Enter your teacher passcode.</p>
    <input id="pw" type="password" autocomplete="off" placeholder="Passcode">
    <div class="err">${err||""}</div>
    <button class="btn" id="ok">Open</button>
    <button class="btn ghost" id="back">← Back</button>
  </div>`;
  $("#back").onclick=()=>viewStart();
  $("#ok").onclick=async e=>{
    const p=$("#pw").value;e.target.disabled=true;
    try{const r=await api.admin(p);if(r&&r.rows){adm.pass=p;adm.rows=r.rows;adm.now=r.now||Date.now();renderAdmin();adm.timer=setInterval(refreshAdmin,6000)}else viewAdminGate("Wrong passcode.")}
    catch(x){viewAdminGate("Can't reach the server.")}
  };
}
async function refreshAdmin(){
  try{const r=await api.admin(adm.pass);if(r&&r.rows){adm.rows=r.rows;adm.now=r.now||Date.now();renderAdmin()}}catch(e){}
}
function missedList(r){
  try{
    const qs=buildQs(r.cls,r.slot,r.key),out=[];
    (r.ans||[]).forEach((k,i)=>{const q=qs[i];if(q&&!(k>=0&&q.opts[k]===q.w)){const nm=WORDS[q.w].w+(k<0?" (no answer)":"");if(!out.includes(nm))out.push(nm)}});
    return out;
  }catch(e){return[]}
}
function renderAdmin(){
  const rows=adm.rows,tab=adm.tab;
  const inTab=r=>tab==="All"||r.cls===tab;
  const fin=rows.filter(r=>r.status==="finished"&&inTab(r)).sort((a,b)=>b.score-a.score||a.time-b.time);
  const play=rows.filter(r=>r.status==="playing"&&inTab(r));
  const out=rows.filter(r=>r.status==="out"&&inTab(r));
  const top=fin.slice(0,3),rest=fin.slice(3);
  const pod=(r,i)=>r?`<div class="pod p${i+1}"><div class="m">${["🥇","🥈","🥉"][i]}</div><div class="a">${esc(r.avatar)}</div><div class="n">${esc(r.name)}</div><div class="muted">${r.cls} · ${fmtTime(r.time)}</div><div class="s">${r.score}/${TOTAL}</div></div>`:`<div></div>`;
  const rowHTML=(r,rank)=>`<details data-k="${esc(r.key)}" ${adm.open[r.key]?"open":""}><summary class="lb"><span class="r">${rank}</span><span class="a">${esc(r.avatar)}</span><span class="n">${esc(r.name)} <span class="muted">${r.cls}</span></span><span class="muted">${fmtTime(r.time)}</span><span class="s">${r.score}/${TOTAL}</span></summary><div class="det">${(()=>{const m=missedList(r);return m.length?`<b>Missed:</b> ${m.map(esc).join(", ")}`:"No mistakes 🎉"})()}<div style="margin-top:8px"><button class="btn sm ghost" data-reset="${esc(r.key)}">Allow retake</button></div></div></details>`;
  app.innerHTML=`
  <h1>🏆 Live results</h1>
  <p class="muted">${HAS_GAS?"Updates every few seconds":"Preview mode · this device only"} · ${fin.length} finished · ${play.length} playing · ${out.length} out</p>
  <div class="tabs">${["All","10A","10B"].map(t=>`<button data-t="${t}" class="${t===tab?"on":""}">${t}</button>`).join("")}</div>
  ${fin.length?`<div class="podium">${pod(top[1],1)}${pod(top[0],0)}${pod(top[2],2)}</div>
    <div class="card" style="padding:6px 14px">${top.map((r,i)=>rowHTML(r,i+1)).join("")}${rest.map((r,i)=>rowHTML(r,i+4)).join("")}</div>`
   :`<div class="card center muted">Nobody has finished yet.</div>`}
  ${play.length?`<div class="sec">▶️ Playing now (${play.length})</div><div class="card" style="padding:8px 14px">${play.map(r=>{
     const idle=(adm.now-(r.updatedAt||0))>120000;
     return `<div style="padding:8px 0"><div class="lb" style="padding:0"><span class="a">${esc(r.avatar)}</span><span class="n">${esc(r.name)} <span class="muted">${r.cls}</span></span><span class="muted">Q ${r.answered}/${TOTAL}</span>${r.leaves?`<span class="chip warn">left ${r.leaves}×</span>`:""}${idle?`<span class="chip bad">inactive</span>`:""}</div><div class="prog"><i style="width:${Math.round((r.answered||0)/TOTAL*100)}%"></i></div></div>`}).join("")}</div>`:""}
  ${out.length?`<div class="sec">🚫 Out of the quiz (${out.length})</div><div class="card" style="padding:8px 14px">${out.map(r=>`<div class="lb"><span class="a">${esc(r.avatar)}</span><span class="n">${esc(r.name)} <span class="muted">${r.cls}</span><div class="muted">${esc(r.reason||"Left the page")} · Q ${r.answered}/${TOTAL}</div></span><button class="btn sm ghost" data-reset="${esc(r.key)}">Allow retake</button></div>`).join("")}</div>`:""}
  <div class="row" style="margin-top:14px">${fin.length?`<button class="btn sm ghost" id="cpy">Copy ranking as text</button>`:""}</div>
  <div class="center"><button class="link" id="out">Leave teacher area</button></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{adm.tab=b.dataset.t;renderAdmin()});
  document.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{adm.open[d.dataset.k]=d.open}));
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(b.dataset.sure){try{await api.reset(adm.pass,b.dataset.reset)}catch(x){} refreshAdmin()}
    else{b.dataset.sure="1";b.textContent="Tap again to confirm"}
  });
  if($("#cpy"))$("#cpy").onclick=e=>copyText(fin.map((r,i)=>`${i+1}. ${r.name} (${r.cls}) - ${r.score}/${TOTAL} - ${fmtTime(r.time)}`).join("\n"),e.target);
  $("#out").onclick=()=>{stopAdmin();viewStart()};
}

/* ---------------- START ---------------- */
(function init(){
  const me=store("fc3_me");
  if(!me){return viewStart()}
  if(me.status==="finished"){A=mk(me);A.sent=me.sent||0;viewResult(A,true);if(!A.sent)pushFinal();return}
  if(me.status==="out"){A=mk(me);A.sent=me.sent||0;viewOut(A);if(!A.sent)pushFinal();return}
  if(me.status==="playing"){
    A=mk(me);
    if(decide(me)==="resume")return resumeQuiz();
    return goOut("Closed the quiz or left the page and came back");
  }
  viewStart();
})();
</script>
